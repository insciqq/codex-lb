[advisories]
version = 2
yanked = "deny"
ignore = [
    # Unmaintained, not vulnerable; reached only through hyper 1.8.1, which stays
    # pinned to the Codex release family (test_native_egress_lockfile_pins_codex_release_family).
    { id = "RUSTSEC-2026-0441", reason = "pin-utils is archived with no safe upgrade; hyper is pinned to the Codex release family" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/openai-oss-forks/tokio-tungstenite",
    "https://github.com/openai-oss-forks/tungstenite-rs",
]

name: Patched CI guard

# patched only moves to a SHA that already passed CI on a wip/merge-* branch
# (checks are per commit), so ci.yml does not run on patched pushes. This
# seconds-long check fails when the pushed head has no successful full CI
# run, so an unchecked patched head shows red instead of unchecked.

on:
  push:
    branches: ["patched"]

permissions:
  actions: read
  contents: read

jobs:
  guard:
    name: Require a green CI run for the patched head
    runs-on: ubuntu-24.04
    if: github.repository == 'insciqq/codex-lb'
    timeout-minutes: 5

    steps:
      # Only full-suite runs count: pull_request runs skip jobs by path.
      - name: Require a successful CI run for the commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_sha == env.SHA and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch" or .event == "merge_group"))] | map(.html_url) | .[]')"
          if [[ -z "${runs}" ]]; then
            echo "::error::no successful full CI run for ${SHA}; push it as wip/merge-<name> or run gh workflow run CI --ref patched"
            exit 1
          fi
          echo "successful CI runs for ${SHA}:"
          echo "${runs}"

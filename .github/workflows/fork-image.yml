name: Fork image

# Publishes the fork's container image for a `v<upstream base>-fork.<n>` tag.
# Upstream's release.yml and publish-beta-release.yml stay disabled and
# untouched; this workflow only builds and pushes the image, with no PyPI,
# Helm chart, GitHub release or floating tags.
#
# It runs on the tag ref only: a tag push, or `gh workflow run "Fork image"
# --ref v<version>`. The run's commit is then the tag commit, so the
# provenance attestation names the commit that was built.
#
# verify  the tag commit is reachable from origin/patched, has a successful
#         full CI run (checks are per commit, so the green wip/merge-* run of
#         the same SHA counts) and carries the tag's version in every
#         release-managed file.
# build   builds once and pushes by digest only, without tags.
# attest  signs build provenance for that digest; a re-run of failed jobs
#         re-signs without rebuilding.
# tag     points <version> and sha-<full SHA> at the digest. A tag that
#         already names this digest is kept, any other digest fails the job,
#         and an unclear registry answer fails closed.
#
# Deploy by the sha- tag or by digest, and verify with
#   gh attestation verify oci://ghcr.io/insciqq/codex-lb@<digest> \
#     --repo insciqq/codex-lb --source-digest <commit SHA> \
#     --signer-workflow insciqq/codex-lb/.github/workflows/fork-image.yml

on:
  push:
    tags: ["v*-fork.*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/insciqq/codex-lb
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  verify:
    name: Verify tag, branch, versions and CI
    runs-on: ubuntu-24.04
    if: github.repository == 'insciqq/codex-lb'
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      version: ${{ steps.tag.outputs.version }}

    steps:
      - name: Validate tag name
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "${REF_TYPE}" != tag ]]; then
            echo "::error::run this workflow on a tag ref: gh workflow run \"Fork image\" --ref v<version>"
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-fork\.[1-9][0-9]*$ ]]; then
            echo "::error::tag ${RELEASE_TAG} does not match v<major>.<minor>.<patch>-fork.<n>"
            exit 1
          fi

      # fetch-depth 0 brings every branch and tag, including origin/patched.
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the run commit to be the tag commit
        id: tag
        run: |
          set -euo pipefail
          sha="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "${sha}" != "${GITHUB_SHA}" ]]; then
            echo "::error::run commit ${GITHUB_SHA} is not the commit of ${RELEASE_TAG} (${sha})"
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "${RELEASE_TAG} -> ${sha}"

      - name: Require the commit on patched
        env:
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          git rev-parse --verify refs/remotes/origin/patched > /dev/null
          if ! git merge-base --is-ancestor "${SHA}" refs/remotes/origin/patched; then
            echo "::error::${SHA} is not reachable from origin/patched"
            exit 1
          fi

      # Python and the dashboard use the PEP 440 form X.Y.Z+fork.N; the Helm
      # chart uses the tag's SemVer form X.Y.Z-fork.N, which image tags and
      # Kubernetes label values accept.
      - name: Require the tag version in the project files
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import tomllib
          from pathlib import Path

          semver = os.environ["VERSION"]
          pep440 = semver.replace("-fork.", "+fork.", 1)
          chart = Path("deploy/helm/codex-lb/Chart.yaml").read_text()
          uv_lock = Path("uv.lock").read_text()

          def field(pattern: str, text: str) -> str | None:
              match = re.search(pattern, text, re.MULTILINE)
              return match.group(1).strip() if match else None

          found = {
              "pyproject.toml": (tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"], pep440),
              "app/__init__.py": (field(r'^__version__ = "([^"]+)"', Path("app/__init__.py").read_text()), pep440),
              "frontend/package.json": (json.loads(Path("frontend/package.json").read_text())["version"], pep440),
              "uv.lock": (field(r'^name = "codex-lb"\nversion = "([^"]+)"', uv_lock), pep440),
              "Chart.yaml version": (field(r"^version: (.+)$", chart), semver),
              "Chart.yaml appVersion": (field(r"^appVersion: (.+)$", chart), semver),
          }
          drift = {name: f"{actual!r} != {expected!r}" for name, (actual, expected) in found.items() if actual != expected}
          if drift:
              print(f"::error::version drift: {drift}")
              sys.exit(1)
          print(f"project version {pep440}, chart version {semver}")
          PY

      # Only full-suite runs count: pull_request runs skip jobs by path.
      - name: Require a successful CI run for the commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_sha == env.SHA and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch" or .event == "merge_group"))] | map(.html_url) | .[]')"
          if [[ -z "${runs}" ]]; then
            echo "::error::no successful full CI run for ${SHA}"
            exit 1
          fi
          echo "successful CI runs for ${SHA}:"
          echo "${runs}"

  build:
    name: Build and push by digest
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No cache: a tag-scoped cache never hits again and only widens what a
      # release build trusts.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          pull: true
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
          annotations: |
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ needs.verify.outputs.sha }}
            index:org.opencontainers.image.version=${{ needs.verify.outputs.version }}

      - name: Require a digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::build returned no image digest: '${DIGEST}'"
            exit 1
          fi
          echo "pushed ${IMAGE}@${DIGEST}"

  attest:
    name: Attest build provenance
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No predicate inputs: actions/attest generates SLSA build provenance.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories.
          create-storage-record: false

  tag:
    name: Tag the digest
    needs: [verify, build, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point the version and sha tags at the digest
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          SHA: ${{ needs.verify.outputs.sha }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail

          # Prints the root digest of a tag, "absent" for a missing tag, and
          # fails after retries on any other registry answer.
          tag_digest() {
            local ref="$1" out attempt
            for attempt in 1 2 3 4; do
              if out="$(docker buildx imagetools inspect "${ref}" 2>&1)"; then
                awk '/^Digest:/ { print $2; exit }' <<< "${out}"
                return 0
              fi
              if grep -qiE 'not found|manifest unknown|name unknown' <<< "${out}"; then
                echo absent
                return 0
              fi
              echo "attempt ${attempt}: could not inspect ${ref}: ${out}" >&2
              sleep $((attempt * 15))
            done
            echo "::error::registry did not answer for ${ref}" >&2
            return 1
          }

          for ref in "${IMAGE}:${VERSION}" "${IMAGE}:sha-${SHA}"; do
            current="$(tag_digest "${ref}")"
            if [[ "${current}" == "${DIGEST}" ]]; then
              echo "${ref} already points to ${DIGEST}"
              continue
            fi
            if [[ "${current}" != absent ]]; then
              echo "::error::${ref} already points to ${current}, not ${DIGEST}; image tags are immutable"
              exit 1
            fi
            docker buildx imagetools create --tag "${ref}" "${IMAGE}@${DIGEST}"
            current="$(tag_digest "${ref}")"
            if [[ "${current}" != "${DIGEST}" ]]; then
              echo "::error::${ref} points to ${current} after tagging, expected ${DIGEST}"
              exit 1
            fi
            echo "tagged ${ref} -> ${DIGEST}"
          done

      - name: Write job summary
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          SHA: ${{ needs.verify.outputs.sha }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "## Fork image ${RELEASE_TAG}"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Revision | \`${SHA}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Tags | \`${IMAGE}:${VERSION}\`, \`${IMAGE}:sha-${SHA}\` |"
            echo
            echo '```bash'
            echo "docker pull ${IMAGE}@${DIGEST}"
            echo "gh attestation verify oci://${IMAGE}@${DIGEST} --repo ${GITHUB_REPOSITORY} \\"
            echo "  --source-digest ${SHA} \\"
            echo "  --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/fork-image.yml"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
